<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SmartPack AI</title>
<style>
:root{--bg:#f6f8f5;--card:#fff;--ink:#1c2a20;--mute:#5f6e64;--acc:#2f7d4f;--acc2:#e7f3ec;--line:#dbe4dd;--warn:#b4691a;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#111813;--card:#1a241d;--ink:#e8f0ea;--mute:#9db0a2;--acc:#5cc488;--acc2:#1f3327;--line:#2b3a2f;--warn:#e5a55d}}
:root[data-theme="dark"]{--bg:#111813;--card:#1a241d;--ink:#e8f0ea;--mute:#9db0a2;--acc:#5cc488;--acc2:#1f3327;--line:#2b3a2f;--warn:#e5a55d}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Noto Sans Devanagari","Noto Sans Telugu",Roboto,sans-serif;line-height:1.55}
.wrap{max-width:960px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;margin:8px 0 28px;text-align:center}
.logo{font-weight:800;font-size:38px;letter-spacing:1px}.logo span{color:var(--acc)}
.logo+select{width:auto;min-width:130px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:16px}
h1{font-size:26px;margin:0 0 6px}h2{font-size:18px;margin:0 0 10px}p{margin:0 0 10px;color:var(--mute)}
.drop{border:2px dashed var(--acc);background:var(--acc2);border-radius:14px;padding:36px 16px;text-align:center;cursor:pointer}
button,select,input{font:inherit}
.btn{background:var(--acc);color:#fff;border:0;border-radius:10px;padding:11px 20px;font-weight:600;cursor:pointer}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media(max-width:700px){.grid{grid-template-columns:1fr}.logo{font-size:30px}}
label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
select,input{width:100%;padding:10px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink)}
img.food{width:100%;max-height:340px;object-fit:cover;border-radius:12px;border:1px solid var(--line)}
.tag{display:inline-block;background:var(--acc2);color:var(--acc);border-radius:99px;padding:3px 10px;font-size:12px;font-weight:600;margin:0 6px 6px 0}
.note{background:var(--acc2);border-left:4px solid var(--warn);padding:10px 12px;border-radius:8px;font-size:13px}
table{width:100%;border-collapse:collapse;font-size:14px}
td{padding:7px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-weight:600;padding-left:12px}
ul{margin:0;padding:0;list-style:none}li{padding:3px 0}li::before{content:"✓ ";color:var(--acc);font-weight:700}
.big{font-size:22px;font-weight:800;color:var(--acc);margin:0 0 6px}.hide{display:none}

.item{margin-bottom:10px}.itemlbl{font-size:12px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.5px}
h3{font-size:15px;margin:16px 0 6px}
.guide p{color:var(--ink)}
.tag.risk-High{background:var(--hibg);color:var(--hi)}.tag.risk-Medium{background:var(--mdbg);color:var(--md)}.tag.risk-Low{background:var(--lobg);color:var(--lo)}
:root{--hi:#b3261e;--hibg:#fbe4e1;--md:#8a5200;--mdbg:#fdefd5;--lo:#1e6b3c;--lobg:#e1f3e7}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--hi:#ffb4ab;--hibg:#4a1f1b;--md:#f2c27a;--mdbg:#47340f;--lo:#8fd9a8;--lobg:#1d3a28}}
:root[data-theme="dark"]{--hi:#ffb4ab;--hibg:#4a1f1b;--md:#f2c27a;--mdbg:#47340f;--lo:#8fd9a8;--lobg:#1d3a28}
</style>
</head>
<body>
<div class="wrap">
<header><div class="logo">SMARTPACK <span>AI</span></div>
<select id="lang" aria-label="Language"><option value="0">English</option><option value="1">हिन्दी</option><option value="2">తెలుగు</option></select></header>

<section id="p1"><div class="card"><h1 data-i="h_up"></h1><p data-i="p_up"></p>
<div class="drop" id="drop"><div style="font-size:40px">📷</div><b data-i="choose"></b></div>
<input type="file" id="file" accept="image/*" class="hide">
<p style="font-size:12px;margin:12px 0 0" data-i="ai_note"></p></div></section>

<section id="p2" class="hide"><div class="grid">
<div class="card"><img id="prev" class="food" alt=""></div>
<div class="card"><h2 data-i="det"></h2>
<div class="item"><span class="itemlbl" data-i="item"></span><div class="big" id="itemName"></div></div><div class="note" id="detNote"></div>
<label for="food" data-i="confirm"></label><select id="food"></select>
<label for="life" data-i="life"></label><input id="life" type="number" min="1" max="365" value="10">
<label for="storage" data-i="storage"></label><select id="storage"></select>
<label for="hours" data-i="hrs"></label><input id="hours" type="number" min="0.5" max="720" step="0.5" value="12">
<label for="temp" data-i="temp"></label><input id="temp" type="number" value="5">
<div style="margin-top:16px;display:flex;gap:8px"><button class="btn" id="go" data-i="go"></button><button class="btn ghost" id="back1" data-i="back"></button></div>
</div></div></section>
<section id="p3" class="hide"></section>
</div>

w_s1:["Short shelf life or ambient storage → a simple perforated film is enough","कम शेल्फ लाइफ या सामान्य भंडारण → साधारण छिद्रित फिल्म पर्याप्त","తక్కువ షెల్ఫ్ లైఫ్/సాధారణ నిల్వ → సాధారణ రంధ్రాల ఫిల్మ్ చాలు"],

tg_S:["Deliver quickly; standard handling is usually enough.","जल्दी पहुँचाएँ; सामान्य हैंडलिंग आमतौर पर पर्याप्त है।","త్వరగా అందించండి; సాధారణ నిర్వహణ సాధారణంగా సరిపోతుంది."],

sp_fruit:["Fruit spoils mainly through continued ripening and respiration, moisture loss, bruising and mould.","फल मुख्य रूप से लगातार पकने और श्वसन, नमी की कमी, चोट लगने और फफूँद से खराब होते हैं।","పండ్లు ప్రధానంగా పండడం, శ్వాసక్రియ కొనసాగడం, తేమ కోల్పోవడం, దెబ్బలు, బూజు వల్ల పాడవుతాయి."],

sp_bake:["Bread spoils through staling, drying, mould growth and squashing.","ब्रेड बासी होने, सूखने, फफूँद लगने और दबने से खराब होती है।","బ్రెడ్ పాతబడడం, ఎండిపోవడం, బూజు పట్టడం, నలిగిపోవడం వల్ల పాడవుతుంది."],
pk_fruit1:["Sort the fruit first: remove bruised, cut or overripe pieces, because one rotten fruit spoils the rest.","पहले फलों को छाँटें: चोटिल, कटे या अधिक पके फल हटा दें, क्योंकि एक सड़ा फल बाकी को खराब कर देता है।","ముందుగా పండ్లను వేరు చేయండి: దెబ్బతిన్న, కోసిన లేదా ఎక్కువగా పండిన వాటిని తీసేయండి, ఎందుకంటే ఒక కుళ్ళిన పండు మిగతావాటిని పాడు చేస్తుంది."],
pk_fruit2:["Pack in one or two layers in ventilated crates or cartons, with paper or foam-net cushioning between the fruits.","हवादार क्रेट या कार्टन में एक या दो परत में पैक करें, फलों के बीच कागज़ या फोम नेट की गद्दी लगाएँ।","గాలి ఆడే క్రేట్లు లేదా డబ్బాల్లో ఒకటి లేదా రెండు వరుసల్లో ప్యాక్ చేయండి, పండ్ల మధ్య కాగితం లేదా ఫోమ్ నెట్ ఉంచండి."],
pk_fruit3:["Line the carton with the recommended packaging shown above and keep the vents open so heat and moisture can escape.","कार्टन में ऊपर बताई गई सुझाई गई पैकेजिंग लगाएँ और छिद्र खुले रखें ताकि गर्मी और नमी बाहर निकल सके।","డబ్బాలో పైన చూపిన సూచించిన ప్యాకేజింగ్ ఉంచండి, వేడి, తేమ బయటకు పోయేలా రంధ్రాలు తెరిచి ఉంచండి."],
pk_veg1:["Remove damaged, wet, soft or sprouting pieces before packing.","पैक करने से पहले क्षतिग्रस्त, गीले, नरम या अंकुरित टुकड़े हटा दें।","ప్యాక్ చేసే ముందు దెబ్బతిన్న, తడిగా ఉన్న, మెత్తబడిన లేదా మొలకెత్తిన వాటిని తీసేయండి."],
pk_veg2:["Keep the produce dry and pack it in ventilated bags, mesh or crates; do not seal wet vegetables in plastic.","सब्ज़ियों को सूखा रखें और हवादार थैलों, जाली या क्रेट में पैक करें; गीली सब्ज़ियों को प्लास्टिक में बंद न करें।","కూరగాయలను పొడిగా ఉంచి గాలి ఆడే సంచులు, మెష్ లేదా క్రేట్లలో ప్యాక్ చేయండి; తడి కూరగాయలను ప్లాస్టిక్‌లో మూసివేయకండి."],
pk_veg3:["Do not stack heavy loads on top, and keep soft items such as tomatoes in shallow layers.","ऊपर भारी सामान न रखें, और टमाटर जैसी नरम चीज़ों को उथली परतों में रखें।","పైన బరువైన వస్తువులు పేర్చకండి, టమాటా వంటి మెత్తని వాటిని తక్కువ పొరల్లో ఉంచండి."],
pk_snack1:["Use sealed, nitrogen-flushed metallized pouches and check every seal; air and moisture make chips stale.","सील बंद, नाइट्रोजन भरे मेटलाइज़्ड पाउच इस्तेमाल करें और हर सील जाँचें; हवा और नमी चिप्स को बासी कर देती है।","సీల్ చేసిన, నైట్రోజన్ నింపిన మెటలైజ్డ్ పౌచ్‌లను వాడండి, ప్రతి సీల్ చూడండి; గాలి, తేమ చిప్స్‌ను పాతబరుస్తాయి."],
pk_snack2:["Pack the pouches in strong corrugated cartons with enough space and cushioning so the chips do not get crushed.","पाउच को मज़बूत नालीदार कार्टन में पर्याप्त जगह और गद्दी के साथ पैक करें ताकि चिप्स कुचलें नहीं।","చిప్స్ నలిగిపోకుండా పౌచ్‌లను దృఢమైన కొరుగేటెడ్ డబ్బాల్లో తగినంత ఖాళీ, కుషనింగ్‌తో ప్యాక్ చేయండి."],
pk_snack3:["Keep cartons away from sunlight, heat and damp floors, and do not open or re-pack them in humid air.","कार्टन को धूप, गर्मी और नम फर्श से दूर रखें; नम हवा में खोलें या दोबारा पैक न करें।","డబ్బాలను ఎండ, వేడి, తడి నేల నుండి దూరంగా ఉంచండి; తేమ గాలిలో తెరవకండి లేదా మళ్లీ ప్యాక్ చేయకండి."],
pk_bake1:["Let bread cool fully before packing, otherwise steam turns into condensation and mould.","पैक करने से पहले ब्रेड को पूरी तरह ठंडा होने दें, वरना भाप संघनन और फफूँद बन जाती है।","ప్యాక్ చేసే ముందు బ్రెడ్‌ను పూర్తిగా చల్లారనివ్వండి, లేకపోతే ఆవిరి తేమగా మారి బూజు పడుతుంది."],
pk_bake2:["Use a micro-perforated bag inside a rigid tray or crate so the loaves are not squashed.","ब्रेड को दबने से बचाने के लिए सूक्ष्म-छिद्रित थैली को कठोर ट्रे या क्रेट में रखें।","బ్రెడ్ నలగకుండా సూక్ష్మ రంధ్రాల సంచిని దృఢమైన ట్రే లేదా క్రేట్‌లో ఉంచండి."],
tt_fresh_S:["Short trip (under 6 hours): normal packing is enough. Load just before leaving and keep the load out of direct sun.","छोटी यात्रा (6 घंटे से कम): सामान्य पैकिंग पर्याप्त है। निकलने से ठीक पहले लोड करें और माल को सीधी धूप से बचाएँ।","తక్కువ ప్రయాణం (6 గంటల కంటే తక్కువ): సాధారణ ప్యాకింగ్ చాలు. బయలుదేరే ముందే లోడ్ చేయండి, నేరుగా ఎండ తగలకుండా చూడండి."],
tt_fresh_M:["Medium trip (6–24 hours): pre-cool the produce before loading, use vented cartons, keep the vehicle shaded and avoid stopping in the sun.","मध्यम यात्रा (6–24 घंटे): लोड करने से पहले माल को ठंडा करें, हवादार कार्टन इस्तेमाल करें, वाहन को छाया में रखें और धूप में रुकने से बचें।","మధ్యస్థ ప్రయాణం (6–24 గంటలు): లోడ్ చేసే ముందు ఉత్పత్తులను చల్లబరచండి, రంధ్రాలున్న డబ్బాలు వాడండి, వాహనాన్ని నీడలో ఉంచండి, ఎండలో ఆగకండి."],
tt_fresh_L:["Long trip (over 24 hours): pre-cool before loading, use insulated or refrigerated transport, leave air gaps between cartons and check the load at every stop for soft or rotting pieces.","लंबी यात्रा (24 घंटे से अधिक): लोड करने से पहले ठंडा करें, इन्सुलेटेड या रेफ्रिजरेटेड परिवहन इस्तेमाल करें, कार्टन के बीच हवा के लिए जगह छोड़ें और हर पड़ाव पर नरम या सड़ते टुकड़ों की जाँच करें।","ఎక్కువ ప్రయాణం (24 గంటల కంటే ఎక్కువ): లోడ్ చేసే ముందు చల్లబరచండి, ఇన్సులేటెడ్ లేదా రిఫ్రిజిరేటెడ్ రవాణా వాడండి, డబ్బాల మధ్య గాలి ఖాళీలు వదలండి, ప్రతి ఆగిన చోట మెత్తబడిన లేదా కుళ్ళిన వాటిని చూడండి."],
tt_dry_S:["Short trip (under 6 hours): normal cartons are enough; keep the load dry and out of direct sun.","छोटी यात्रा (6 घंटे से कम): सामान्य कार्टन पर्याप्त हैं; माल को सूखा रखें और सीधी धूप से बचाएँ।","తక్కువ ప్రయాణం (6 గంటల కంటే తక్కువ): సాధారణ డబ్బాలు చాలు; సరుకును పొడిగా ఉంచి నేరుగా ఎండ తగలకుండా చూడండి."],
tt_dry_M:["Medium trip (6–24 hours): use strong cartons, cover the load against rain and heat, and avoid parking in the sun.","मध्यम यात्रा (6–24 घंटे): मज़बूत कार्टन इस्तेमाल करें, माल को बारिश और गर्मी से ढकें और धूप में गाड़ी खड़ी न करें।","మధ్యస్థ ప్రయాణం (6–24 గంటలు): దృఢమైన డబ్బాలు వాడండి, వర్షం, వేడి నుండి సరుకును కప్పండి, ఎండలో వాహనం నిలపకండి."],
tt_dry_L:["Long trip (over 24 hours): use strong, sealed cartons, keep the load cool, dry and shaded, limit unloading and reloading, and avoid heat building up inside the vehicle.","लंबी यात्रा (24 घंटे से अधिक): मज़बूत, सील बंद कार्टन इस्तेमाल करें, माल को ठंडा, सूखा और छाया में रखें, बार-बार उतारने-चढ़ाने से बचें और वाहन के अंदर गर्मी जमा न होने दें।","ఎక్కువ ప్రయాణం (24 గంటల కంటే ఎక్కువ): దృఢమైన, సీల్ చేసిన డబ్బాలు వాడండి, సరుకును చల్లగా, పొడిగా, నీడలో ఉంచండి, తరచుగా దించి ఎక్కించకండి, వాహనం లోపల వేడి పేరుకుపోకుండా చూడండి."],
temp_ok:["Your storage temperature is within the ideal range for this food, so keep it steady.","आपका भंडारण तापमान इस खाद्य पदार्थ के लिए आदर्श सीमा में है, इसे स्थिर रखें।","మీ నిల్వ ఉష్ణోగ్రత ఈ ఆహారానికి అనువైన పరిధిలో ఉంది, దాన్ని స్థిరంగా ఉంచండి."],
temp_hot:["Your temperature is above the ideal range ({0}), so spoilage will be faster. Cool the product, shorten the storage time or use a higher-barrier film.","आपका तापमान आदर्श सीमा ({0}) से अधिक है, इसलिए माल जल्दी खराब होगा। उसे ठंडा करें, भंडारण का समय घटाएँ या अधिक अवरोध वाली फिल्म इस्तेमाल करें।","మీ ఉష్ణోగ్రత అనువైన పరిధి ({0}) కంటే ఎక్కువగా ఉంది, కాబట్టి త్వరగా పాడవుతుంది. ఉత్పత్తిని చల్లబరచండి, నిల్వ సమయం తగ్గించండి లేదా ఎక్కువ అవరోధం ఉన్న ఫిల్మ్ వాడండి."],
temp_cold:["Your temperature is below the ideal range ({0}), which can cause chilling injury or quality loss (for example, faster staling of bread). Raise it slightly or insulate the load.","आपका तापमान आदर्श सीमा ({0}) से कम है, जिससे ठंड से नुकसान या गुणवत्ता में कमी हो सकती है (जैसे ब्रेड जल्दी बासी होना)। इसे थोड़ा बढ़ाएँ या माल को इन्सुलेट करें।","మీ ఉష్ణోగ్రత అనువైన పరిధి ({0}) కంటే తక్కువగా ఉంది, దీనివల్ల చలి నష్టం లేదా నాణ్యత తగ్గవచ్చు (ఉదా: బ్రెడ్ త్వరగా పాతబడడం). కొద్దిగా పెంచండి లేదా సరుకును ఇన్సులేట్ చేయండి."],
temp_frozen:["Frozen storage: keep the temperature steady at -18 °C or colder and avoid thawing and refreezing.","जमा भंडारण: तापमान -18 °C या उससे कम स्थिर रखें और पिघलाने-दोबारा जमाने से बचें।","గడ్డకట్టిన నిల్వ: ఉష్ణోగ్రతను -18 °C లేదా అంతకంటే తక్కువగా స్థిరంగా ఉంచండి, కరిగించి మళ్లీ గడ్డకట్టించకండి."]

function transportFromHours(h){return h<6?"Short":h<=24?"Medium":"Long"}
function rulePack(name,resp,life,st,tr){
 if(name==="Potato Chips")return life>90?"pk7":"pk3";
 if(st==="Frozen")return "pk5";
 if(name==="Bread")return "pk4";
 if(name==="Potato"||name==="Onion")return "pk2";
 if(st==="Chilled"&&(tr==="Long"||life>10)&&(resp==="High"||resp==="Medium"))return "pk1";
 return "pk0"}
function packingGuide(f,life,st,tr,temp){
 var g=GROUP[f.category]||"veg",fresh=g==="fruit"||g==="veg",tips,warm=false,score=0;
 if(st==="Frozen"){tips=[{key:"temp_frozen",arg:null}];warm=temp>-15;if(warm)tips.push({key:"temp_hot",arg:"-18 °C"})}
 else if(temp>f.temp_max){tips=[{key:"temp_hot",arg:f.storage_temp}];warm=true}
 else if(temp<f.temp_min){tips=[{key:"temp_cold",arg:f.storage_temp}]}
 else tips=[{key:"temp_ok",arg:null}];
 if(st==="Frozen"){if(warm)score+=2}
 else if(temp>f.temp_max)score+=(temp-f.temp_max<=5?1:2);
 else if(temp<f.temp_min)score+=1;
 score+=fresh?{Short:0,Medium:1,Long:2}[tr]:(tr==="Long"?1:0);
 if(life>LONGLIFE[g])score+=1;
 return{group:g,risk:score>=4?"High":score>=2?"Medium":"Low",causes:CAUSES[g],packing_steps:STEPS[g],
  travel_tip:"tt_"+(fresh?"fresh":"dry")+"_"+tr[0],temperature_tips:tips}}
function normFood(n){n=String(n).replace(/[_\-]+/g," ").trim().replace(/\w\S*/g,function(w){return w[0].toUpperCase()+w.slice(1).toLowerCase()});return ALIASES[n]||n}
function guessFromName(fn){
 var text=" "+fn.toLowerCase().replace(/[^a-z]+/g," ")+" ",keys={};
 Object.keys(FOODS_DB).forEach(function(n){keys[n.toLowerCase()]=n});
 Object.keys(ALIASES).forEach(function(a){keys[a.toLowerCase()]=ALIASES[a]});
 var hits=Object.keys(keys).filter(function(k){return text.indexOf(" "+k+" ")>-1||text.replace(/ /g,"").indexOf(k.replace(/ /g,""))>-1});
 if(!hits.length)return null;
 hits.sort(function(a,b){return b.length-a.length});return keys[hits[0]]}
function localRecommend(b){
 var food=normFood(b.food),life=parseInt(b.shelf_life),st=String(b.storage_type),temp=parseFloat(b.temperature),h=parseFloat(b.travel_hours);
 var f=FOODS_DB[food];
 if(!f)return[404,{error:"Unsupported food: "+food}];
 if(!(life>=1&&life<=365)||isNaN(temp)||!(h>0&&h<=720)||["Ambient","Chilled","Frozen"].indexOf(st)<0)return[400,{error:"Invalid input"}];
 var tr=transportFromHours(h),pid=rulePack(f.name,f.respiration,life,st,tr);
 return[200,{food:f,inputs:{shelf_life:life,storage_type:st,transportation:tr,temperature:temp,travel_hours:h},
  packaging:PACK_DB[pid],alternative:PACK_DB[ALT[pid]||"pk0"],eco_option:PACK_DB[ECO[pid]||"pk6"],why:WHYK[pid],
  guide:packingGuide(f,life,st,tr,temp),method:"rules",model_probability:null}]}
/* Photo recognition: ask Claude (artifact "sample" capability) which food is in the picture.
   Falls back to a file-name guess when Claude is not available to this viewer. */
async function aiDetect(file){
 try{
  if(!window.claude||!window.claude.use||!file)return null;
  var sample=await window.claude.use("sample");
  if(!sample)return null;
  var lim=await sample.limits();
  if(!lim||!lim.images)return null;
  var names=Object.keys(FOODS_DB);
  var prompt="You are the food-recognition step of a food-packaging app. Look at the attached photo and decide which ONE of these foods it shows: "+names.join(", ")+". "+
   "Pay attention to colour, shape and surface: a tomato is smooth, glossy and usually red with a green calyx; an apple is firmer and rounder with a stem dimple. "+
   "'Potato Chips' means chips or crisps (packaged or loose), not whole potatoes or french fries. "+
   "If the photo shows none of these foods, answer None. Reply with JSON only, exactly in this shape: {\"food\":\"<exact name from the list, or None>\"}";
  var r=await sample.json(prompt,{images:file,modelTier:"quick"});
  var f=r&&String(r.food||"").trim();
  var hit=names.filter(function(n){return n.toLowerCase()===String(f).toLowerCase()})[0];
  if(hit)return{status:"ai",predictions:[{food:hit,probability:null}]};
  if(/^none$/i.test(f))return{status:"none",predictions:[]};
  return null;
 }catch(e){return null}
}
Object.assign(T,{ai_note:["The photo is analysed by Claude (AI) to identify the food; this page does not store it.","फोटो का विश्लेषण खाद्य पदार्थ पहचानने के लिए Claude (AI) द्वारा किया जाता है; यह पेज इसे सहेजता नहीं है।","ఆహారాన్ని గుర్తించడానికి ఫోటోను Claude (AI) విశ్లేషిస్తుంది; ఈ పేజీ దాన్ని నిల్వ చేయదు."]});
/* Fake "server": app.js calls fetch("/api/..."); answer from the local engine */
window.fetch=function(url,opts){
 function reply(code,obj){return{ok:code===200,status:code,json:function(){return Promise.resolve(obj)}}}
 if(String(url).indexOf("detect-food")>-1){
  var file=opts.body.get("image");
  return aiDetect(file).then(function(r){
   if(r)return reply(200,r);
   var g=guessFromName(file&&file.name||"");
   return reply(200,{status:"model_unavailable",predictions:g?[{food:g,probability:null}]:[]})})}
 var out=localRecommend(JSON.parse(opts.body));
 return Promise.resolve(reply(out[0],out[1]))};

// SmartPack AI frontend. Talks to the Flask backend (same origin when served by Flask).
var API = window.SMARTPACK_API || "/api";
var $ = function (i) { return document.getElementById(i); };
var FOOD_NAMES = ["Apple", "Banana", "Mango", "Orange", "Tomato", "Potato", "Onion", "Carrot", "Potato Chips", "Bread"];
var S = { img: "", note: null, res: null };

function fillSel(id, vals) {
  var el = $(id), v = el.value;
  el.innerHTML = vals.map(function (x) { return '<option value="' + x + '">' + t(x) + "</option>"; }).join("");
  if (v) el.value = v;
}

function fillFood() {
  var el = $("food"), v = el.value;
  el.innerHTML = '<option value="">' + t("pick") + "</option>" +
    FOOD_NAMES.map(function (x) { return '<option value="' + x + '">' + t(x) + "</option>"; }).join("");
  el.value = v;   // "" (nothing chosen) until the user or the detector picks a food
}
function updateItem() { $("itemName").textContent = $("food").value ? t($("food").value) : t("pick"); }
$("food").onchange = updateItem;

function noteText() {
  if (!S.note) return "";
  var k = S.note[0];
  if (k === "n_det") return t(k, t(S.note[1]), S.note[2]);
  if (k === "n_low") return t(k, S.note[1].map(function (f) { return t(f); }).join(", "));
  if (k === "n_guess" || k === "n_ai") return t(k, t(S.note[1]));
  return t(k);
}

function apply() {
  document.documentElement.lang = ["en", "hi", "te"][li];
  document.querySelectorAll("[data-i]").forEach(function (e) { e.textContent = t(e.getAttribute("data-i")); });
  fillFood();
  fillSel("storage", ["Ambient", "Chilled", "Frozen"]);
  $("detNote").textContent = noteText();
  updateItem();
  if (S.res) render();
}

function show(n) {
  ["p1", "p2", "p3"].forEach(function (p, i) {
    $(p).classList.toggle("hide", i + 1 !== n);
  });
  window.scrollTo(0, 0);
}

// ---- language ----
$("lang").onchange = function () {
  li = +this.value;
  try { localStorage.setItem("sp_lang", li); } catch (e) {}
  apply();
};
try { var sv = localStorage.getItem("sp_lang"); if (sv) { li = +sv; $("lang").value = sv; } } catch (e) {}

// ---- step 1: upload + detect (POST /api/detect-food) ----
$("drop").onclick = function () { $("file").click(); };
$("file").onchange = async function (e) {
  var f = e.target.files[0];
  if (!f) return;
  S.img = await new Promise(function (res) { var r = new FileReader(); r.onload = function () { res(r.result); }; r.readAsDataURL(f); });
  $("prev").src = S.img;
  S.note = ["working"];
  $("food").value = "";          // never keep the previous (or first) food by accident
  apply();
  show(2);
  var fd = new FormData();
  fd.append("image", f);
  try {
    var r = await fetch(API + "/detect-food", { method: "POST", body: fd });
    var d = await r.json();
    var preds = d.predictions || [];
    if (d.status === "ok") S.note = ["n_det", preds[0].food, Math.round(preds[0].probability * 100)];
    else if (d.status === "ai") S.note = ["n_ai", preds[0].food];
    else if (d.status === "none") S.note = ["n_none"];
    else if (d.status === "low_confidence") S.note = ["n_low", preds.map(function (p) { return p.food; })];
    else if (preds.length) S.note = ["n_guess", preds[0].food];
    else S.note = ["n_manual"];
    apply();
    if (preds.length) $("food").value = preds[0].food;
    updateItem();
  } catch (err) {
    S.note = ["n_err"];
    apply();
  }
};
$("back1").onclick = function () { show(1); };

// ---- step 2: details -> recommendation (POST /api/recommend) ----
$("go").onclick = async function () {
  if (!$("food").value) { alert(t("pick")); return; }
  var body = {
    food: $("food").value,
    shelf_life: +$("life").value || 1,
    storage_type: $("storage").value,
    travel_hours: +$("hours").value || 1,
    temperature: +$("temp").value
  };
  $("go").disabled = true;
  try {
    var r = await fetch(API + "/recommend", {
      method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body)
    });
    var d = await r.json();
    if (!r.ok) throw new Error(d.error || "error");
    S.res = d;
    render();
    show(3);
  } catch (err) {
    alert(t("err_rec"));
  }
  $("go").disabled = false;
};

// ---- step 3: result page (dynamic: same page for every food) ----
function lv(level, value) { return t("v_" + level) + (value ? " (" + String(value).replace(/</g, "&lt;") + ")" : ""); }

function render() {
  var d = S.res, f = d.food, p = d.packaging, i = d.inputs;
  var rows = [
    ["OTR", lv(p.otr_level, p.otr_value)],
    ["WVTR", lv(p.wvtr_level, p.wvtr_value)],
    ["thk", p.thickness],
    ["seal", t("v_" + p.sealability)],
    ["strg", t("v_" + p.strength)],
    ["map", t(p.map_suitable ? "yes" : "no")]
  ];
  var why = [t(f.category) + " · " + t("moisture") + ": " + t("v_" + f.moisture) + " · " + t("fat") + ": " + t("v_" + f.fat)]
    .concat(d.why.map(function (k) { return t(k); }));
  var hrs = i.travel_hours || "";
  why.push(t("storage") + ": " + t(i.storage_type) + " · " + t("hrs") + ": " + hrs + " · " + t("life") + ": " + i.shelf_life);
  var method = d.method === "ml" ? t("m_ml", Math.round((d.model_probability || 0) * 100)) : t("m_rules");
  var g = d.guide;
  function items(arr) { return "<ul>" + arr.map(function (x) { return "<li>" + x + "</li>"; }).join("") + "</ul>"; }

  $("p3").innerHTML =
    '<div class="grid"><div class="card"><img class="food" src="' + S.img + '" alt="' + t(f.name) + '">' +
    '<div class="itemlbl" style="margin-top:14px">' + t("item") + '</div><h1>' + f.emoji + " " + t(f.name) + "</h1>" +
    '<span class="tag">' + t(f.category) + '</span><span class="tag">' + t("moisture") + ": " + t("v_" + f.moisture) +
    '</span><span class="tag">' + t("fat") + ": " + t("v_" + f.fat) + '</span><span class="tag">' + t("v_" + f.ph) +
    '</span><span class="tag">' + t("resp") + ": " + t("v_" + f.respiration) + "</span></div>" +
    '<div class="card"><p style="margin:0">' + t("rec") + '</p><div class="big">' + t(p.id) + "</div><table>" +
    rows.map(function (r) { return "<tr><td>" + t(r[0]) + "</td><td>" + r[1] + "</td></tr>"; }).join("") +
    '</table><p style="font-size:12px;margin:10px 0 0">' + method + "</p></div></div>" +

    '<div class="card guide"><h2>' + t("pack_h") + '</h2><p><span class="tag risk risk-' + g.risk + '">' + t("risk") + ": " + t("v_" + g.risk) + "</span></p>" +
    "<p>" + t(g.causes) + "</p>" +
    "<h3>" + t("steps_h") + "</h3>" + items(g.packing_steps.map(function (k) { return t(k); })) +
    "<h3>" + t("travel_h") + " (" + hrs + " " + t("hr_u") + ")</h3><p>" + t(g.travel_tip) + "</p>" +
    "<h3>" + t("temp_h") + " (" + i.temperature + " °C)</h3>" +
    g.temperature_tips.map(function (x) { return "<p>" + t(x.key, x.arg || "") + "</p>"; }).join("") + "</div>" +

    '<div class="card"><h2>' + t("why") + "</h2>" + items(why) + "</div>" +
    '<div class="card"><h2>' + t("stor") + "</h2><p>" + f.storage_temp + ". " + t(f.note) + '.</p><p style="margin:0">' +
    t("plan") + ": " + t(i.storage_type) + ", " + i.temperature + " °C, " + i.shelf_life + "</p></div>" +
    '<div class="grid"><div class="card"><h2>' + t("alt") + '</h2><p style="margin:0">' + t(d.alternative.id) +
    '</p></div><div class="card"><h2>' + t("eco") + '</h2><p style="margin:0">' + t(d.eco_option.id) + "</p></div></div>" +
    '<p style="font-size:12px">' + t("foot") + '</p><button class="btn" id="again">' + t("again") + "</button>";
  $("again").onclick = function () { $("file").value = ""; S.res = null; show(1); };
}

apply();

</script>
</body>
